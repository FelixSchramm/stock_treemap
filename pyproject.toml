[project]
name = "portfolio-dashboard"
version = "0.1.0"
description = "Portfolio dashboard scaffold with an offline synthetic demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.0",
    "plotly>=5.20",
    "requests>=2.32.4",
    "streamlit>=1.40",
]

[project.optional-dependencies]
prototype = ["yfinance>=0.2.40"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Streamlit's asyncio loop uses local Unix sockets; IP sockets stay blocked.
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
