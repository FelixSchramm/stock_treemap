[project]
name = "portfolio-dashboard"
version = "0.1.0"
description = "Portfolio dashboard scaffold with an offline synthetic demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.0",
    "plotly>=5.20",
    "streamlit>=1.40",
]

[project.optional-dependencies]
prototype = ["yfinance>=0.2.40"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
