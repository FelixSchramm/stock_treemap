# Reference only. Never put real values in this tracked example.
# Provision the actual server-side .streamlit/secrets.toml via host secrets.
# The application and Streamlit's OIDC callback use the SAME [auth] section.
# Root-level strings become environment variables (see .env.example); keep
# them above the first section.
PORTFOLIO_MODE = "production"
PORTFOLIO_OWNER_ISSUER = "https://accounts.google.com"
PORTFOLIO_OWNER_SUBJECT = "<VALIDATED_OWNER_SUBJECT>"
PORTFOLIO_SHEET_ID = "<PRIVATE_SOURCE_ID>"
PORTFOLIO_SHEET_RANGE = "<PRIVATE_WORKSHEET_RANGE>"

[auth]
redirect_uri = "<HTTPS_APP_URL_WITH_OAUTH2CALLBACK_PATH>"
cookie_secret = "<STRONG_RANDOM_SERVER_SIDE_COOKIE_SECRET>"
client_id = "<GOOGLE_OIDC_CLIENT_ID>"
client_secret = "<GOOGLE_OIDC_CLIENT_SECRET>"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Read-only Sheet access, separate from the login client above: every field of
# the service-account JSON key as a TOML string (production only).
[sheets_service_account]
type = "service_account"
project_id = "<PROJECT_ID>"
private_key_id = "<PRIVATE_KEY_ID>"
private_key = "<PRIVATE_KEY_WITH_ESCAPED_NEWLINES>"
client_email = "<SERVICE_ACCOUNT_EMAIL>"
client_id = "<SERVICE_ACCOUNT_CLIENT_ID>"
token_uri = "https://oauth2.googleapis.com/token"

# Optional: owner-verified Yahoo EUR listings for live quotes, same format as
# the local listings file (README). Without entries only Sheet values are shown.
[[listing]]
isin = "<SHEET_ISIN>"
type = "stock"
symbol = "<YAHOO_SYMBOL>"
venue = "GER"
equity_form = "share"
